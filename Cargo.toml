[package]
name = "lens"
version = "0.1.0"
edition = "2024"
description = "A lightweight Windows magnifier: select a screen region and view it live, magnified, in a floating window."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Magnification",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "lens"
path = "src/main.rs"
