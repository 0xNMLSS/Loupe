[package]
name = "loupe"
version = "0.1.0"
edition = "2024"
description = "A lightweight Windows magnifier: select a screen region and view it live, magnified, in a floating window."
license = "MIT OR Apache-2.0"
publish = false

[features]
# Omit on local builds: a console window stays attached for `eprintln!` / debugging.
# Enable for shipped `.exe` (see `.github/workflows/release.yml`).
hide_console = []

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Magnification",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "loupe"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0.8"
